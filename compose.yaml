services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Run scripts/initialize-lab.ps1 first}
      MARIADB_USER: ${DB_USER:?Run scripts/initialize-lab.ps1 first}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run scripts/initialize-lab.ps1 first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/initialize-lab.ps1 first}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      args:
        OSTICKET_REF: v1.18.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:80"
    volumes:
      - osticket_config:/var/lib/osticket-config
      - osticket_attachments:/var/www/html/attachments

volumes:
  db_data:
  osticket_config:
  osticket_attachments:
